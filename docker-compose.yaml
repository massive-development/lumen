services:
  bitnet-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitnet-cpu
    restart: unless-stopped
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "10" # leave 2 cores for OS + other services
    volumes:
      - ./models:/app/BitNet/models
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')",
        ]
      timeout: 10s
      interval: 60s
      retries: 3
      start_period: 30s

  # GPU-accelerated inference — preferred by Olla over bitnet-cpu when healthy
  bitnet-gpu:
    build:
      context: .
      dockerfile: gpu.Dockerfile
      args:
        # 86 = Ampere (RTX 3000). Override for other GPUs: 89 = Ada (RTX 4000), 75 = Turing
        CUDA_ARCH: ${CUDA_ARCH}
    container_name: bitnet-gpu
    restart: unless-stopped
    env_file: .env
    environment:
      # GPU_PORT → PORT: server.go reads PORT, but .env uses GPU_PORT to avoid
      # clashing with other services that also expose a PORT variable.
      - PORT=${GPU_PORT}
    volumes:
      - ./gpu/checkpoints:/app/BitNet/gpu/checkpoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')",
        ]
      timeout: 10s
      interval: 60s
      retries: 3
      start_period: 120s

  # PostgreSQL — persistent store for memory service and pgvector RAG embeddings
  postgres:
    image: pgvector/pgvector:pg16   # pgvector/pgvector includes the vector extension
    container_name: bitnet-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Persistent memory store — facts, preferences, summaries
  memory:
    build:
      context: ./memory
      dockerfile: Dockerfile
    container_name: bitnet-memory
    restart: unless-stopped
    env_file: .env
    environment:
      # Constructed from three separate .env vars — can't be expressed as a single env_file entry.
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:6000/health",
        ]
      start_period: 10s
      interval: 60s
      timeout: 5s
      retries: 3

  # Anthropic → OpenAI proxy for Claude Code
  anthropic-proxy:
    build:
      context: .
      dockerfile: proxy.Dockerfile
    container_name: bitnet-anthropic-proxy
    restart: unless-stopped
    env_file: .env
    depends_on:
      memory:
        condition: service_healthy
      olla:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Olla proxy/load balancer — routes between CPU and GPU backends
  olla:
    image: ghcr.io/thushan/olla:latest
    container_name: bitnet-olla
    restart: unless-stopped
    volumes:
      - ./olla.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    depends_on:
      bitnet-cpu:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:40114/internal/health",
        ]
      timeout: 5s
      interval: 60s
      retries: 3
      start_period: 10s

  # Ollama — serves embedding models for RAG (not used for generation)
  ollama:
    image: ollama/ollama
    container_name: bitnet-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-shot init: pulls the embedding model into Ollama on first run
  ollama-pull:
    image: ollama/ollama
    container_name: bitnet-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull $EMBEDDING_MODEL"]

  # SearXNG — self-hosted metasearch engine (Google, Bing, DDG, etc.)
  # OpenWebUI web search points here; no external API keys needed
  searxng:
    image: searxng/searxng:latest
    container_name: bitnet-searxng
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "wget --header='X-Forwarded-For: 127.0.0.1' -qO- http://localhost:8080/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # OpenWebUI Pipelines — server-side middleware for message filtering,
  # PII redaction, prompt injection, custom model providers, and more.
  # After startup: add http://pipelines:9099 in OpenWebUI Admin → Connections.
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: bitnet-pipelines
    restart: unless-stopped
    env_file: .env
    volumes:
      - pipelines_data:/app/pipelines
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9099/ || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Faster-Whisper — local speech-to-text (OpenAI-compatible /v1/audio/transcriptions)
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: bitnet-whisper
    restart: unless-stopped
    env_file: .env
    environment:
      # WHISPER__ prefix is faster-whisper-server's config namespace — these can't
      # match the .env names directly.
      - WHISPER__MODEL=${WHISPER_MODEL}
      - WHISPER__INFERENCE_DEVICE=cpu
    volumes:
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8000"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s   # model download on first start

  # Kokoro TTS — local text-to-speech (OpenAI-compatible /v1/audio/speech)
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: bitnet-kokoro
    restart: unless-stopped
    volumes:
      - kokoro_models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s   # model download on first start

  # OpenWebUI interface
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: bitnet-openwebui
    restart: unless-stopped
    env_file: .env
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      # ── Model connections ──────────────────────────────────────────────────
      # Cache is first (exact + semantic cache in front of Olla); Pipelines is second.
      # After stack starts, also add Pipelines in Admin → Connections to install pipelines.
      - OPENAI_API_BASE_URLS=http://bitnet-cache:${CACHE_PORT}/v1;http://pipelines:9099
      - OPENAI_API_KEYS=${OPENAI_API_KEY};${PIPELINES_API_KEY}
      - CORS_ALLOW_ORIGIN=${WEBUI_URL}
      # ── RAG — vector store (pgvector on existing PostgreSQL) ───────────────
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # ── RAG — embeddings via Ollama ────────────────────────────────────────
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - OLLAMA_BASE_URLS=http://ollama:11434
      # ── RAG — web search via SearXNG ──────────────────────────────────────
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      # ── Audio — speech-to-text via Whisper ────────────────────────────────
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://whisper:8000/v1
      - AUDIO_STT_OPENAI_API_KEY=sk-not-needed
      # ── Audio — text-to-speech via Kokoro ─────────────────────────────────
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=sk-not-needed
      - AUDIO_TTS_OPENAI_TTS_MODEL=kokoro
      - AUDIO_TTS_OPENAI_TTS_VOICE=${KOKORO_VOICE}
      # ── RAG — document extraction via Apache Tika ──────────────────────────
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
    depends_on:
      bitnet-cache:
        condition: service_healthy
      olla:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Semantic response cache — sits between OpenWebUI and Olla
  # Checks exact hash then cosine similarity (pgvector) before forwarding to backend.
  bitnet-cache:
    build:
      context: ./cache
      dockerfile: Dockerfile
    container_name: bitnet-cache
    restart: unless-stopped
    env_file: .env
    environment:
      - CACHE_PORT=${CACHE_PORT}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CACHE_PORT}/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # OpenAPI tool server — add http://bitnet-tools:8083 in OpenWebUI Admin → Tools
  bitnet-tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: bitnet-tools
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${TOOLS_PORT}
    depends_on:
      memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${TOOLS_PORT}/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Apache Tika — document text extraction for RAG
  # Handles PDFs, Word, Excel, PowerPoint, HTML, and 1000+ other formats.
  # OpenWebUI sends uploaded documents here before chunking and embedding.
  tika:
    image: apache/tika:latest
    container_name: bitnet-tika
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9998"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Langfuse v2 — self-hosted LLM tracing and observability dashboard
  # Access at http://localhost:3000 (HTTP). Credentials are set via LANGFUSE_* env vars.
  # After startup: install "Langfuse Filter Pipeline" in OpenWebUI Pipelines and
  # configure it with LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY from .env.
  langfuse:
    image: langfuse/langfuse:2
    container_name: bitnet-langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Constructed and renamed — Langfuse's expected var names differ from .env names.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      - NEXTAUTH_URL=${LANGFUSE_URL}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_ORG_ID}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_ORG_NAME}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_PROJECT_ID}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_PROJECT_NAME}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_ADMIN_EMAIL}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_ADMIN_NAME}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_ADMIN_PASSWORD}
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  open-terminal:
    image: ghcr.io/open-webui/open-terminal
    container_name: bitnet-open-terminal
    restart: "no"
    volumes:
      - open-terminal:/home/user
    env_file: .env

  # Nginx reverse proxy — single entry point on port 80/443
  # http://bitnet.chat/        → OpenWebUI
  # http://bitnet.chat/proxy/  → Anthropic API proxy (Claude Code)
  nginx:
    image: nginx:alpine
    container_name: bitnet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      openwebui:
        condition: service_healthy
      anthropic-proxy:
        condition: service_healthy

volumes:
  openwebui_data:
    driver: local
  open-terminal:
    driver: local
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  pipelines_data:
    driver: local
  whisper_models:
    driver: local
  kokoro_models:
    driver: local
