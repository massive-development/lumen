events {
    worker_connections 1024;
}

http {
    # Disable buffering globally — LLM responses are streamed (SSE / chunked)
    proxy_buffering    off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Docker's embedded DNS — forces nginx to re-resolve service names on each
    # upstream connection instead of caching IPs at startup. Required so nginx
    # reconnects correctly after any container is restarted and gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/bitnet.crt;
        ssl_certificate_key /etc/nginx/certs/bitnet.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # OpenWebUI — served at root
        location / {
            set $openwebui http://openwebui:8080;
            proxy_pass $openwebui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Anthropic API proxy — Claude Code: ANTHROPIC_BASE_URL=https://bitnet.chat/proxy
        # nginx strips /proxy before forwarding, so /proxy/v1/messages → /v1/messages
        location /proxy/ {
            set $proxy http://anthropic-proxy:5000;
            rewrite ^/proxy/(.*)$ /$1 break;
            proxy_pass $proxy;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Memory API — manage facts and preferences
        # GET    /memory/memories?q=<query>
        # POST   /memory/memories   { "content": "...", "category": "fact|preference|summary" }
        # DELETE /memory/memories/<id>
        location /memory/ {
            set $memory http://memory:6000;
            rewrite ^/memory/(.*)$ /$1 break;
            proxy_pass $memory;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
    }
}
