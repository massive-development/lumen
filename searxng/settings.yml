use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - brave
      - wikipedia
      - github
      - arxiv

server:
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark
